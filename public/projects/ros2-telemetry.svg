<text x="64" y="119" fill="#475569" font-family="Arial,sans-serif" font-size="19">Robot Telemetry Pipeline</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g fill="#fff" stroke="#94a3b8" stroke-width="2">
<rect x="55" y="240" width="205" height="155" rx="16"/><rect x="335" y="240" width="205" height="155" rx="16"/>
