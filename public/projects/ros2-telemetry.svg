</g>
<g fill="#0f172a" font-size="22" font-weight="700">
<text x="157" y="284">ROS 2</text><text x="157" y="315">Simulator</text>
<text x="437" y="284">ROS ↔ MQTT</text><text x="437" y="315">Bridge</text>
<text x="700" y="304">Mosquitto</text><text x="932" y="284">Consumer</text><text x="932" y="315">Worker</text>
<text x="1115" y="304">SQLite</text>
</g>
<g fill="#64748b" font-size="16"><text x="157" y="350">GPS · odometry</text><text x="157" y="374">diagnostics</text><text x="437" y="355">JSON topics</text><text x="700" y="355">MQTT</text><text x="932" y="355">Validate + persist</text></g>
</g>
