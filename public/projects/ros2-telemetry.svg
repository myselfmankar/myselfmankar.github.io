<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ROS 2 Jazzy telemetry pipeline</title><desc id="desc">A simulated ROS 2 robot publishes GPS, odometry and diagnostics through an MQTT bridge and Mosquitto to a consumer, SQLite and FastAPI.</desc>
